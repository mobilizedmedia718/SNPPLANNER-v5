<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Event Preorder</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 20px;
      }
      .wrap {
        max-width: 760px;
        margin: auto;
      }
      .card {
        background: #fff;
        border-radius: 14px;
        padding: 20px;
        margin: 14px 0;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }
      button {
        padding: 10px 14px;
      }
      input {
        padding: 10px;
        width: 100%;
        box-sizing: border-box;
      }
      .item {
        display: grid;
        grid-template-columns: 1fr 90px;
        gap: 10px;
        align-items: end;
        border-bottom: 1px solid #eee;
        padding: 12px 0;
      }
      .muted {
        opacity: 0.7;
      }
      .error {
        color: #a00;
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="app"><div class="card">Loading menu…</div></div>
    <script src="time-format.js?v=1"></script>
    <script>
      const API =
        "https://mmstqostdqouxaiyrxtv.supabase.co/functions/v1/public-preorder";
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#039;",
            })[c],
        );
      const eventId =
        new URLSearchParams(location.search).get("event_id") || "";
      let data = null;
      async function load() {
        const app = document.getElementById("app");
        try {
          const r = await fetch(
            `${API}?event_id=${encodeURIComponent(eventId)}`,
          );
          data = await r.json();
          if (!r.ok || !data.ok)
            throw new Error(data.error || "Unable to load menu.");
          render();
        } catch (e) {
          app.innerHTML = `<div class="card"><h2>Menu unavailable</h2><p class="error">${esc(e.message)}</p></div>`;
        }
      }
      function render() {
        const e = data.event,
          m = data.menu || [];
        document.getElementById("app").innerHTML =
          `<div class="card"><h1>${esc(e.name)}</h1>${e.date ? `<p><strong>Date:</strong> ${esc(e.date)}</p>` : ""}${e.time ? `<p><strong>Time:</strong> ${esc(SNPTime.formatTime(e.time))}</p>` : ""}<p>Preorder food and beverages before the event. Paid items receive a QR code for one-time redemption.</p></div><div class="card"><label>Email for receipt / pickup</label><input id="email" type="email" placeholder="you@example.com"><h2>Menu</h2>${m.length ? m.map((i) => `<div class="item"><div><strong>${esc(i.name)}</strong><br><span>$${Number(i.price).toFixed(2)}</span>${i.description ? `<br><small class="muted">${esc(i.description)}</small>` : ""}</div><div><label>Qty</label><input id="q-${esc(i.id)}" type="number" min="0" max="20" value="0"></div></div>`).join("") : "<p>No preorder items are available yet.</p>"}<p><button onclick="checkout()" ${m.length ? "" : "disabled"}>Pay with Stripe</button></p><div id="msg"></div></div>`;
      }
      async function checkout() {
        const items = (data.menu || [])
          .map((i) => ({
            id: i.id,
            quantity: Number(document.getElementById("q-" + i.id)?.value || 0),
          }))
          .filter((i) => i.quantity > 0);
        if (!items.length)
          return (document.getElementById("msg").innerHTML =
            '<p class="error">Choose at least one item.</p>');
        const email = document.getElementById("email").value.trim();
        document.getElementById("msg").textContent = "Opening Stripe…";
        try {
          const r = await fetch(API, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ eventId, email, items }),
          });
          const d = await r.json();
          if (!r.ok || !d.checkoutUrl)
            throw new Error(d.error || "Unable to start checkout.");
          location.href = d.checkoutUrl;
        } catch (e) {
          document.getElementById("msg").innerHTML =
            `<p class="error">${esc(e.message)}</p>`;
        }
      }
      load();
    </script>
  </body>
</html>
