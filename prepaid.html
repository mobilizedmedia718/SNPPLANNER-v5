<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prepaid Order</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:20px}.wrap{max-width:720px;margin:auto}.card{background:#fff;border-radius:14px;padding:20px;margin:14px 0;box-shadow:0 2px 12px rgba(0,0,0,.08)}.qr{width:280px;max-width:100%;display:block;margin:18px auto}.ok{background:#e9f8ee;border:1px solid #b8e4c5;padding:12px;border-radius:10px}.wait{background:#fff5d9;border:1px solid #eed27c;padding:12px;border-radius:10px}.muted{opacity:.7}</style></head><body><div class="wrap" id="app"><div class="card">Loading prepaid order…</div></div><script>
const API='https://mmstqostdqouxaiyrxtv.supabase.co/functions/v1/prepaid-confirmation';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function load(){const sid=new URLSearchParams(location.search).get('session_id')||'';const app=document.getElementById('app');try{const r=await fetch(`${API}?session_id=${encodeURIComponent(sid)}`,{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Unable to load order.');if(d.pending){app.innerHTML='<div class="card"><h2>Preparing your pickup pass</h2><div class="wait">Payment is confirmed. Your QR code is being prepared.</div></div>';setTimeout(load,1800);return;}app.innerHTML=`<div class="card"><h1>Payment Confirmed</h1><div class="ok">Show this QR code when you are ready to redeem your prepaid items.</div><h2>${esc(d.event.name)}</h2>${d.event.date?`<p><strong>Date:</strong> ${esc(d.event.date)}</p>`:''}${d.guestName?`<p><strong>Guest:</strong> ${esc(d.guestName)}</p>`:''}${d.email?`<p><strong>Email:</strong> ${esc(d.email)}</p>`:''}</div><div class="card"><img class="qr" src="${d.pass.qrDataUrl}" alt="Prepaid order QR"><h3>Prepaid Items</h3>${(d.pass.items||[]).map(i=>`<p><strong>${esc(i.label)}</strong> — ${i.redeemed}/${i.quantity} redeemed</p>`).join('')}<p class="muted">Each prepaid item can be redeemed only the number of times purchased. Already-redeemed items are rejected automatically.</p></div>`}catch(e){app.innerHTML=`<div class="card"><h2>Order unavailable</h2><p>${esc(e.message)}</p><button onclick="location.reload()">Try Again</button></div>`}}
load();
</script></body></html>
