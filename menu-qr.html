<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Event Menu QR</title><style>body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:24px;color:#111}.sheet{max-width:760px;margin:auto;background:#fff;padding:32px;border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.1);text-align:center}.qr{margin:24px auto;display:flex;justify-content:center}.muted{opacity:.7}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.actions button{padding:12px 18px;font-size:16px}@media print{body{background:#fff;padding:0}.sheet{box-shadow:none;max-width:none;border-radius:0}.actions{display:none}}</style></head><body><div class="sheet" id="app"><h2>Preparing menu QR…</h2></div><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
const API='https://mmstqostdqouxaiyrxtv.supabase.co/functions/v1/public-preorder';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const eventId=new URLSearchParams(location.search).get('event_id')||'';
async function load(){const app=document.getElementById('app');try{const r=await fetch(`${API}?event_id=${encodeURIComponent(eventId)}`,{cache:'no-store'});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Unable to load menu.');const url=`https://mobilizedmedia718.github.io/SNPPLANNER-v5/preorder.html?event_id=${encodeURIComponent(eventId)}`;app.innerHTML=`<h1>${esc(d.event.name||'Event')}</h1>${d.event.date?`<p><strong>${esc(d.event.date)}</strong>${d.event.time?` · ${esc(d.event.time)}`:''}</p>`:''}<h2>Scan to View the Menu & Order</h2><p>Choose your food or beverage, pay securely, then show your pickup QR to staff.</p><div id="qr" class="qr"></div><p class="muted">Each paid pickup item can only be redeemed once.</p><div class="actions"><button onclick="window.print()">Print This QR</button><button onclick="navigator.clipboard?.writeText('${url.replace(/'/g,"\\'")}').then(()=>alert('Menu link copied.'))">Copy Menu Link</button></div>`;new QRCode(document.getElementById('qr'),{text:url,width:360,height:360,correctLevel:QRCode.CorrectLevel.M});}catch(e){app.innerHTML=`<h2>Menu QR unavailable</h2><p>${esc(e.message||'Unable to load menu.')}</p>`;}}
load();
</script></body></html>
