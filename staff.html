<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNP Planner Staff Portal</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f6f8;color:#161616}header{background:#111;color:#fff;padding:18px}main{max-width:780px;margin:auto;padding:18px}.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #bbb;box-sizing:border-box}input,select{width:100%}button{cursor:pointer;background:#111;color:#fff}.muted{color:#666;font-size:.92rem}.danger{color:#a40000;font-weight:700}.ok{color:#146c2e;font-weight:700}</style></head><body><header><strong>SNP Planner — Event Staff Portal</strong></header><main id="app"></main><script>
const U='https://mmstqostdqouxaiyrxtv.supabase.co',K='sb_publishable_6bxNaNPgezRwqyTrLtnUpA_zmXNoIsC',SK='snp_staff_session';let S=null,E=[];const h=t=>({apikey:K,'Content-Type':'application/json',...(t?{Authorization:`Bearer ${t}`}:{})});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function auth(msg=''){document.getElementById('app').innerHTML=`<div class="card"><h2>Staff Sign In</h2><p class="muted">This portal is limited to assigned event duties only.</p>${msg?`<p>${esc(msg)}</p>`:''}<label>Email</label><input id="e" type="email"><label>Password</label><input id="p" type="password"><div class="grid" style="margin-top:10px"><button onclick="login()">Sign In</button><button onclick="signup()">Create Staff Account</button></div></div>`}
async function login(){const email=e.value.trim(),password=p.value;const r=await fetch(`${U}/auth/v1/token?grant_type=password`,{method:'POST',headers:h(),body:JSON.stringify({email,password})}),d=await r.json();if(!r.ok)return auth(d.message||d.error_description||'Sign in failed.');S=d;localStorage.setItem(SK,JSON.stringify(d));load()}
async function signup(){const email=e.value.trim(),password=p.value;if(password.length<6)return auth('Use at least 6 characters.');const r=await fetch(`${U}/auth/v1/signup`,{method:'POST',headers:h(),body:JSON.stringify({email,password})}),d=await r.json();if(!r.ok)return auth(d.message||'Account creation failed.');if(d.access_token){S=d;localStorage.setItem(SK,JSON.stringify(d));load()}else auth('Account created. Confirm your email if required, then sign in.')}
async function api(path='',opts={}){const r=await fetch(`${U}/functions/v1/staff-event-api${path}`,{...opts,headers:{...h(S?.access_token),...(opts.headers||{})}}),d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||'Request failed');return d}
async function load(){try{if(!S)S=JSON.parse(localStorage.getItem(SK)||'null');if(!S?.access_token)return auth();const d=await api();E=d.events||[];render()}catch(err){localStorage.removeItem(SK);S=null;auth(err.message)}}
function render(){document.getElementById('app').innerHTML=`<div class="card"><div class="grid"><div><h2>Assigned Events</h2><p class="muted">Only event-operating tools assigned by the organizer appear here.</p></div><div style="text-align:right"><button onclick="logout()">Sign Out</button></div></div></div>${E.length?E.map(card).join(''):`<div class="card"><p>No active event assignments were found for this login.</p></div>`}`}
function card(x){const p=x.permissions||{};return `<div class="card"><h3>${esc(x.name)}</h3><p>${esc(x.date)} ${esc(x.time)}${x.venueName?' • '+esc(x.venueName):''}</p><p class="muted">Tickets sold: ${x.ticketsSold}${x.capacity?' / '+x.capacity:''}</p>${p.can_check_in&&p.can_scan_qr?`<h4>Check In / QR Scan</h4><input id="qr-${x.id}" placeholder="Scan or type SNP ticket QR value"><button onclick="checkin('${x.id}')">Check In Ticket</button>`:''}${p.can_accept_payments?`<h4>Accept Event Payment</h4><p class="muted">Starts secure Stripe Checkout. Payment must be completed now.</p><select id="ticket-${x.id}">${(x.ticketTypes||[]).map(t=>`<option value="${esc(t.id)}" data-name="${esc(t.name)}" data-price="${Number(t.price||0)}">${esc(t.name)} — $${Number(t.price||0).toFixed(2)}</option>`).join('')}</select><input id="qty-${x.id}" type="number" min="1" value="1"><input id="email-${x.id}" type="email" placeholder="Customer email"><button onclick="pay('${x.id}')">Start Payment</button>`:''}${p.can_view_guest_list?`<details><summary>Guest List (${(x.guestList||[]).length})</summary>${(x.guestList||[]).map(g=>`<p>${esc(g.status||'Guest')} ${g.checkedIn?'✓ Checked in':''}</p>`).join('')||'<p>No guests yet.</p>'}</details>`:''}</div>`}
async function checkin(id){try{const v=document.getElementById(`qr-${id}`).value.trim();const d=await api('',{method:'POST',body:JSON.stringify({action:'checkin_snp_ticket',eventId:id,qr:v})});alert(d.message||'Checked in');load()}catch(e){alert(e.message)}}
async function pay(id){try{const sel=document.getElementById(`ticket-${id}`),o=sel.options[sel.selectedIndex],qty=Math.max(1,Number(document.getElementById(`qty-${id}`).value||1)),email=document.getElementById(`email-${id}`).value.trim();const r=await fetch(`${U}/functions/v1/create-stripe-checkout`,{method:'POST',headers:h(S.access_token),body:JSON.stringify({items:[{name:o.dataset.name,price:Number(o.dataset.price),quantity:qty,saleType:'ticket',ticketTypeId:o.value}],eventId:id,customerEmail:email,purchaseType:'ticket',staffCheckout:true})});const d=await r.json();if(!r.ok||!d.checkoutUrl)throw new Error(d.error||'Unable to start payment.');location.href=d.checkoutUrl}catch(e){alert(e.message)}}
function logout(){localStorage.removeItem(SK);S=null;auth('Signed out.')}load();
</script></body></html>
