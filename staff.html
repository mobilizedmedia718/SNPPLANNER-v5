<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNP Planner Staff Portal</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f6f8;color:#161616}header{background:#111;color:#fff;padding:18px}main{max-width:820px;margin:auto;padding:18px}.card{background:#fff;border-radius:12px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,select,button{font:inherit;padding:11px;border-radius:8px;border:1px solid #bbb;box-sizing:border-box}input,select{width:100%}button{cursor:pointer;background:#111;color:#fff}.muted{color:#666;font-size:.92rem}.ok{color:#146c2e;font-weight:700}.danger{color:#a40000;font-weight:700}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}details{margin-top:10px}video{width:100%;max-height:300px;background:#111;border-radius:8px;display:none}</style></head><body><header><strong>SNP Planner — Event Staff Portal</strong></header><main id="app"></main><script>
const U='https://mmstqostdqouxaiyrxtv.supabase.co',K='sb_publishable_6bxNaNPgezRwqyTrLtnUpA_zmXNoIsC',SK='snp_staff_session';let S=null,E=[],stream=null,scanTimer=null,scanTarget=null;const h=t=>({apikey:K,'Content-Type':'application/json',...(t?{Authorization:`Bearer ${t}`}:{})});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>'$'+Number(n||0).toFixed(2);
function auth(msg=''){app.innerHTML=`<div class="card"><h2>Staff Sign In</h2><p class="muted">Only assigned event duties are available here.</p>${msg?`<p>${esc(msg)}</p>`:''}<label>Email</label><input id="e" type="email"><label>Password</label><input id="p" type="password"><div class="grid" style="margin-top:10px"><button onclick="login()">Sign In</button><button onclick="signup()">Create Staff Account</button></div></div>`}
async function login(){const r=await fetch(`${U}/auth/v1/token?grant_type=password`,{method:'POST',headers:h(),body:JSON.stringify({email:e.value.trim(),password:p.value})}),d=await r.json();if(!r.ok)return auth(d.message||d.error_description||'Sign in failed.');S=d;localStorage.setItem(SK,JSON.stringify(d));load()}
async function signup(){if(p.value.length<6)return auth('Use at least 6 characters.');const r=await fetch(`${U}/auth/v1/signup`,{method:'POST',headers:h(),body:JSON.stringify({email:e.value.trim(),password:p.value})}),d=await r.json();if(!r.ok)return auth(d.message||'Account creation failed.');if(d.access_token){S=d;localStorage.setItem(SK,JSON.stringify(d));load()}else auth('Account created. Confirm your email if required, then sign in.')}
async function api(opts={}){const r=await fetch(`${U}/functions/v1/staff-event-api`,{...opts,headers:{...h(S?.access_token),...(opts.headers||{})}}),d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||'Request failed');return d}
async function load(){try{if(!S)S=JSON.parse(localStorage.getItem(SK)||'null');if(!S?.access_token)return auth();const d=await api();E=d.events||[];render()}catch(err){localStorage.removeItem(SK);S=null;auth(err.message)}}
function render(){const q=new URLSearchParams(location.search);const msg=q.get('payment')==='success'?'<div class="card ok">Payment completed. Refreshing event totals.</div>':q.get('payment')==='cancelled'?'<div class="card">Payment was cancelled. No sale was recorded.</div>':'';app.innerHTML=msg+`<div class="card"><div class="grid"><div><h2>Assigned Events</h2><p class="muted">Event operations only. Company/admin data is not available in this portal.</p></div><div style="text-align:right"><button onclick="logout()">Sign Out</button></div></div></div>${E.length?E.map(card).join(''):`<div class="card"><p>No active event assignments were found for this login.</p></div>`}`}
function card(x){const p=x.permissions||{},sh=x.shift||{},sales=x.staffSales||{};return `<div class="card"><h3>${esc(x.name)}</h3><p>${esc(x.date)} ${esc(x.time)}${x.venueName?' • '+esc(x.venueName):''}</p><div class="grid"><div><strong>Shift</strong><p>${sh.active?`Clocked in: ${new Date(sh.clockIn).toLocaleTimeString()}`:sh.clockOut?`Last shift ended: ${new Date(sh.clockOut).toLocaleTimeString()}`:'Not clocked in'}</p><button onclick="clock('${x.id}','${sh.active?'clock_out':'clock_in'}')">${sh.active?'Clock Out':'Clock In'}</button></div><div><strong>Your Event Sales</strong><p>${sales.count||0} paid transactions<br>${money(sales.total)}</p></div><div><strong>Attendance</strong><p>${x.ticketsSold}${x.capacity?' / '+x.capacity:''} tickets sold</p></div></div>${p.can_check_in&&p.can_scan_qr?`<h4>Admission Scanner</h4><div class="row"><input id="qr-${x.id}" placeholder="Scan or type ticket / barcode"><button onclick="camera('${x.id}')">Use Camera</button></div><video id="video-${x.id}" playsinline muted></video><div class="row"><button onclick="checkin('${x.id}','checkin_snp_ticket')">Check In SNP Ticket</button><button onclick="checkin('${x.id}','checkin_eventbrite')">Check In Eventbrite Barcode</button></div>`:''}${p.can_accept_payments?`<h4>Sell Admission Ticket</h4><select id="ticket-${x.id}">${(x.ticketTypes||[]).map(t=>`<option value="${esc(t.id)}" data-name="${esc(t.name)}" data-price="${Number(t.price||0)}">${esc(t.name)} — ${money(t.price)}</option>`).join('')}</select><div class="row"><input id="qty-${x.id}" type="number" min="1" value="1"><input id="email-${x.id}" type="email" placeholder="Customer email"></div><button onclick="payTicket('${x.id}')">Start Secure Payment</button>`:''}${p.can_event_sales&&p.can_accept_payments&&x.menuItems?.length?`<h4>Event Sales</h4><select id="menu-${x.id}">${x.menuItems.map(i=>`<option value="${esc(i.id)}" data-name="${esc(i.name)}" data-price="${Number(i.price||0)}" data-category="${esc(i.category||'')}" data-inventory="${esc(i.inventoryId||'')}">${esc(i.name)} — ${money(i.price)}</option>`).join('')}</select><div class="row"><input id="mqty-${x.id}" type="number" min="1" value="1"><input id="memail-${x.id}" type="email" placeholder="Customer email"></div><button onclick="payItem('${x.id}')">Start Secure Payment</button>`:''}${p.can_redeem_items&&p.can_scan_qr?`<h4>Redeem Prepaid Food / Beverage / Add-ons</h4><div class="row"><input id="pre-${x.id}" placeholder="Scan or type SNP-PREPAID QR"><button onclick="camera('${x.id}','pre')">Use Camera</button><button onclick="inspectPrepaid('${x.id}')">Find Prepaid Items</button></div><div id="preout-${x.id}"></div>`:''}${p.can_view_guest_list?`<details><summary>Guest List (${(x.guestList||[]).length})</summary>${(x.guestList||[]).map(g=>`<p>${esc(g.status||'Guest')} ${g.checkedIn?'✓ Checked in':''} <span class="muted">(${esc(g.source||'')})</span></p>`).join('')||'<p>No guests yet.</p>'}</details>`:''}</div>`}
async function clock(id,action){try{const d=await api({method:'POST',body:JSON.stringify({action,eventId:id})});alert(d.message);load()}catch(e){alert(e.message)}}
async function checkin(id,action){try{await stopCamera();const v=document.getElementById(`qr-${id}`).value.trim();const d=await api({method:'POST',body:JSON.stringify({action,eventId:id,qr:v})});alert(d.message+(d.warning?`\n${d.warning}`:''));load()}catch(e){alert(e.message)}}
async function checkout(payload){const r=await fetch(`${U}/functions/v1/create-stripe-checkout`,{method:'POST',headers:h(S.access_token),body:JSON.stringify({...payload,staffCheckout:true})}),d=await r.json();if(!r.ok||!d.checkoutUrl)throw new Error(d.error||'Unable to start payment.');location.href=d.checkoutUrl}
async function payTicket(id){try{const o=document.getElementById(`ticket-${id}`).selectedOptions[0],qty=Math.max(1,Number(document.getElementById(`qty-${id}`).value||1)),email=document.getElementById(`email-${id}`).value.trim();await checkout({items:[{name:o.dataset.name,price:Number(o.dataset.price),quantity:qty,saleType:'ticket',ticketTypeId:o.value}],eventId:id,customerEmail:email,purchaseType:'ticket'})}catch(e){alert(e.message)}}
async function payItem(id){try{const o=document.getElementById(`menu-${id}`).selectedOptions[0],qty=Math.max(1,Number(document.getElementById(`mqty-${id}`).value||1)),email=document.getElementById(`memail-${id}`).value.trim();await checkout({items:[{name:o.dataset.name,price:Number(o.dataset.price),quantity:qty,saleType:'sale',category:o.dataset.category,inventoryId:o.dataset.inventory}],eventId:id,customerEmail:email,purchaseType:'sale'})}catch(e){alert(e.message)}}
async function inspectPrepaid(id){try{await stopCamera();const qr=document.getElementById(`pre-${id}`).value.trim(),d=await api({method:'POST',body:JSON.stringify({action:'inspect_prepaid',eventId:id,qr})}),p=d.pass;document.getElementById(`preout-${id}`).innerHTML=`<div class="card"><strong>Prepaid order</strong>${p.items.map(i=>`<p>${esc(i.label)} — ${i.remaining} remaining <button ${i.remaining<=0?'disabled':''} onclick="redeem('${id}','${p.id}','${i.id}')">Redeem 1</button></p>`).join('')}</div>`}catch(e){alert(e.message)}}
async function redeem(eventId,passId,entitlementId){try{const d=await api({method:'POST',body:JSON.stringify({action:'redeem_prepaid',eventId,passId,entitlementId})});alert(d.message);inspectPrepaid(eventId)}catch(e){alert(e.message)}}
async function camera(id,target='qr'){await stopCamera();if(!navigator.mediaDevices?.getUserMedia)return alert('Camera access is not available.');try{const v=document.getElementById(`video-${id}`);stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=stream;v.style.display='block';await v.play();scanTarget={id,target};if('BarcodeDetector'in window){const d=new BarcodeDetector({formats:['qr_code','code_128','code_39','ean_13','upc_a']});const tick=async()=>{if(!stream)return;try{const codes=await d.detect(v);if(codes?.length){const out=target==='pre'?document.getElementById(`pre-${id}`):document.getElementById(`qr-${id}`);out.value=codes[0].rawValue;await stopCamera();return}}catch(_){}scanTimer=setTimeout(tick,250)};tick()}else alert('Camera opened, but this browser does not support automatic barcode detection. Use the camera to read the code and enter it manually.')}catch(e){await stopCamera();alert('Unable to open camera. Check camera permission.')}}
async function stopCamera(){if(scanTimer)clearTimeout(scanTimer);scanTimer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;document.querySelectorAll('video').forEach(v=>{v.pause?.();v.srcObject=null;v.style.display='none'})}
function logout(){stopCamera();localStorage.removeItem(SK);S=null;auth('Signed out.')}load();
</script></body></html>
