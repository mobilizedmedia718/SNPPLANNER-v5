<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SNP Planner Staff Portal</title>
    <style>
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        background: #f3f5f8;
        color: #172033;
      }
      header {
        position: sticky;
        top: 0;
        z-index: 10;
        background: #111827;
        color: #fff;
        padding: 16px 20px;
        box-shadow: 0 2px 12px rgba(0,0,0,.18);
      }
      main {
        max-width: 1080px;
        margin: auto;
        padding: 20px;
      }
      .card {
        background: #fff;
        border: 1px solid #e3e7ee;
        border-radius: 14px;
        padding: 18px;
        margin: 14px 0;
        box-shadow: 0 4px 16px rgba(24,39,75,.05);
      }
      .event-card { overflow: hidden; padding: 0; }
      .event-head { background: linear-gradient(135deg,#111827,#26344f); color:#fff; padding:20px; }
      .event-head h2 { margin:0 0 6px; }
      .event-body { padding:18px; }
      .section { border-top:1px solid #e6e9ef; margin-top:18px; padding-top:18px; }
      .section h3 { margin:0 0 6px; }
      .stat { background:#f7f8fb; border:1px solid #e4e8ef; border-radius:12px; padding:14px; }
      .stat strong { display:block; font-size:.82rem; color:#5e6879; margin-bottom:6px; text-transform:uppercase; letter-spacing:.04em; }
      .stat .value { font-size:1.25rem; font-weight:750; color:#172033; }
      .item-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; margin:12px 0; }
      .sale-item { border:1px solid #dfe4ec; border-radius:12px; padding:13px; background:#fbfcfe; }
      .sale-item strong { display:block; margin-bottom:4px; }
      .price { color:#146c43; font-weight:800; font-size:1.08rem; }
      .badge { display:inline-block; border-radius:999px; padding:4px 9px; font-size:.78rem; font-weight:700; background:#e8edf6; color:#33405b; margin:2px 4px 2px 0; }
      .badge.ok { background:#e7f6ed; color:#146c43; }
      .nested { background:#f7f9fc; border:1px solid #e0e5ed; border-radius:12px; padding:13px; margin-top:10px; }
      .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
      .toolbar > button { flex:0 1 auto; }
      .section-note { margin:4px 0 12px; color:#626d7e; }
      .empty { padding:16px; border:1px dashed #cdd3dd; border-radius:10px; color:#667085; text-align:center; }
      .guest-row { display:flex; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid #edf0f4; }
      .guest-row:last-child { border-bottom:0; }
      .primary { background:#175cd3; border-color:#175cd3; }
      .secondary { background:#fff; color:#172033; border-color:#aeb7c6; }
      .success { background:#177447; border-color:#177447; }
      .danger-btn { background:#a92525; border-color:#a92525; }
      button:disabled { opacity:.55; cursor:not-allowed; }
      button:focus-visible,input:focus-visible,select:focus-visible { outline:3px solid rgba(23,92,211,.25); outline-offset:2px; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 10px;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .row > * {
        flex: 1;
        min-width: 150px;
      }
      input,
      select,
      button,
      textarea {
        font: inherit;
        padding: 11px;
        border-radius: 8px;
        border: 1px solid #bbb;
        box-sizing: border-box;
      }
      input,
      select,
      textarea {
        width: 100%;
      }
      label { display:block; margin:10px 0 5px; font-weight:650; }
      .required::after { content:" *"; color:#a92525; }
      button {
        cursor: pointer;
        background: #172033;
        color: #fff;
        font-weight: 650;
      }
      .muted {
        color: #666;
        font-size: 0.92rem;
      }
      .ok {
        color: #146c2e;
        font-weight: 700;
      }
      .danger {
        color: #a40000;
        font-weight: 700;
      }
      .notice {
        padding: 11px 12px;
        border-radius: 8px;
        background: #eef4ff;
        border: 1px solid #b9cdf5;
        color: #173b73;
        line-height: 1.4;
      }
      video {
        width: 100%;
        max-height: 300px;
        background: #111;
        border-radius: 8px;
        display: none;
      }
      details {
        margin-top: 10px;
      }
      summary { cursor:pointer; font-weight:750; }
      @media (max-width:640px){main{padding:12px}.event-body,.event-head{padding:15px}.row>*{min-width:100%}.toolbar>button{width:100%}}
    </style>
  </head>
  <body>
    <header><strong>SNP Planner</strong> <span style="opacity:.72">— Employee Event Portal</span></header>
    <main id="app"></main>
    <script src="time-format.js?v=1"></script>
    <script>
      const nativeLocaleTime = Date.prototype.toLocaleTimeString;
      Date.prototype.toLocaleTimeString = function (locales, options = {}) {
        return nativeLocaleTime.call(this, locales || "en-US", {
          hour: "numeric",
          minute: "2-digit",
          ...options,
          hour12: true,
        });
      };
      const U = "https://mmstqostdqouxaiyrxtv.supabase.co",
        K = "sb_publishable_6bxNaNPgezRwqyTrLtnUpA_zmXNoIsC",
        SK = "snp_staff_session";
      let S = null,
        E = [],
        stream = null,
        scanTimer = null,
        authRedirectType = "";
      const h = (t) => ({
        apikey: K,
        "Content-Type": "application/json",
        ...(t ? { Authorization: `Bearer ${t}` } : {}),
      });
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[m],
        );
      const money = (n) => "$" + Number(n || 0).toFixed(2);
      const invite = () =>
        new URLSearchParams(location.search).get("invite") || "";
      const pendingEmailKey = "snp_staff_pending_email";
      function redirectUrl() {
        const url = new URL(location.href);
        url.hash = "";
        ["code", "error", "error_code", "error_description", "type"].forEach(
          (key) => url.searchParams.delete(key),
        );
        return url.toString();
      }
      function auth(msg = "", email = "") {
        const remembered =
          email || sessionStorage.getItem(pendingEmailKey) || "";
        app.innerHTML = `${invite() ? '<div class="card"><h3>Employee / Staff Invitation</h3><p>Create your staff account or sign in with the email this invitation was sent to. All required profile information must be completed before continuing.</p></div>' : ""}<div class="card"><h2>Staff Sign In</h2><p class="muted">Only assigned event duties are available here.</p>${msg ? `<p class="notice">${esc(msg)}</p>` : ""}<label>Email</label><input id="e" type="email" value="${esc(remembered)}" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false"><label>Password</label><input id="p" type="password" minlength="8" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false"><label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input id="showp" type="checkbox" style="width:auto" onchange="togglePassword()"> Show password</label><button style="width:100%;margin-top:10px" onclick="login()">Sign In</button><div class="grid" style="margin-top:10px"><button class="secondary" type="button" onclick="forgotPassword()">Forgot Password</button><button class="secondary" type="button" onclick="resendConfirmation()">Resend Confirmation</button></div></div><div class="card"><h2>Create Staff Account</h2><p class="muted">Fields marked with * are required. You cannot create an account until all fields are complete.</p><div class="grid"><div><label class="required">First Name</label><input id="signupFirstName" autocomplete="given-name" required></div><div><label class="required">Last Name</label><input id="signupLastName" autocomplete="family-name" required></div></div><label class="required">Street Address</label><input id="signupAddress" autocomplete="street-address" required><div class="grid"><div><label class="required">Email</label><input id="signupEmail" type="email" value="${esc(remembered)}" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" required></div><div><label class="required">Cellphone</label><input id="signupPhone" type="tel" autocomplete="tel" inputmode="tel" required></div></div><label class="required">Password</label><input id="signupPassword" type="password" minlength="8" autocomplete="new-password" required><label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input id="showSignupPassword" type="checkbox" style="width:auto" onchange="toggleSignupPassword()"> Show password</label><button style="width:100%;margin-top:10px" onclick="signup()">Create Staff Account</button><p class="muted">New accounts must confirm their email once. Existing confirmed accounts should sign in; they will not receive another signup confirmation.</p></div>`;
      }
      function togglePassword() {
        const x = document.getElementById("p");
        if (x)
          x.type = document.getElementById("showp")?.checked
            ? "text"
            : "password";
      }
      function toggleSignupPassword() {
        const x = document.getElementById("signupPassword");
        if (x) x.type = document.getElementById("showSignupPassword")?.checked ? "text" : "password";
      }
      function normalizePhone(value) {
        const raw = String(value || "").trim();
        const digits = raw.replace(/\D/g, "");
        if (digits.length === 10) return "+1" + digits;
        if (digits.length === 11 && digits.startsWith("1")) return "+" + digits;
        if (raw.startsWith("+") && digits.length >= 8 && digits.length <= 15)
          return "+" + digits;
        return "";
      }
      function metadata() {
        return S?.user?.user_metadata || {};
      }
      function onboardingValues() {
        const m = metadata();
        return {
          firstName: String(m.first_name || ""),
          lastName: String(m.last_name || ""),
          address: String(m.street_address || ""),
          phone: String(S?.user?.phone || m.cellphone || m.phone || ""),
        };
      }
      function profileComplete() {
        const v = onboardingValues();
        return Boolean(
          v.firstName &&
            v.lastName &&
            v.address &&
            v.phone &&
            S?.user?.email &&
            S?.user?.email_confirmed_at,
        );
      }
      async function refreshCurrentUser() {
        const r = await fetch(`${U}/auth/v1/user`, {
          headers: h(S?.access_token),
        });
        if (!r.ok) return false;
        S.user = await r.json();
        localStorage.setItem(SK, JSON.stringify(S));
        return true;
      }
      function onboarding(msg = "") {
        const v = onboardingValues();
        app.innerHTML = `<div class="card"><h2>Required Employee Onboarding</h2><p class="muted">Complete every required field before entering the Employee Portal. Your email must be verified; your cellphone number is required but does not require verification.</p>${msg ? `<p class="notice">${esc(msg)}</p>` : ""}<div class="grid"><div><label class="required">First Name</label><input id="onboardFirstName" value="${esc(v.firstName)}" autocomplete="given-name" required></div><div><label class="required">Last Name</label><input id="onboardLastName" value="${esc(v.lastName)}" autocomplete="family-name" required></div></div><label class="required">Street Address</label><input id="onboardAddress" value="${esc(v.address)}" autocomplete="street-address" required><label class="required">Verified Email</label><input value="${esc(S?.user?.email || "")}" readonly><label class="required">Cellphone Number</label><input id="onboardPhone" type="tel" value="${esc(v.phone)}" autocomplete="tel" inputmode="tel" required><button type="button" class="success" style="width:100%;margin-top:14px" onclick="completeOnboarding()">Save Profile & Continue</button><p class="muted">You cannot continue until every required field is complete.</p></div>`;
      }
      function readOnboarding() {
        const firstName = document.getElementById("onboardFirstName")?.value.trim() || "";
        const lastName = document.getElementById("onboardLastName")?.value.trim() || "";
        const streetAddress = document.getElementById("onboardAddress")?.value.trim() || "";
        const phone = normalizePhone(document.getElementById("onboardPhone")?.value || "");
        if (!firstName) throw new Error("Enter your first name.");
        if (!lastName) throw new Error("Enter your last name.");
        if (!streetAddress) throw new Error("Enter your street address.");
        if (!phone) throw new Error("Enter a valid cellphone number, including area code.");
        return { firstName, lastName, streetAddress, phone };
      }
      async function completeOnboarding() {
        try {
          const v = readOnboarding();
          await refreshCurrentUser();
          if (!S?.user?.email_confirmed_at)
            throw new Error("Verify your email before continuing.");
          const profileResponse = await fetch(`${U}/auth/v1/user`, {
            method: "PUT",
            headers: h(S.access_token),
            body: JSON.stringify({
              data: {
                ...metadata(),
                first_name: v.firstName,
                last_name: v.lastName,
                full_name: `${v.firstName} ${v.lastName}`,
                street_address: v.streetAddress,
                phone: v.phone,
                cellphone: v.phone,
              },
            }),
          });
          const profileUser = await profileResponse.json().catch(() => ({}));
          if (!profileResponse.ok)
            throw new Error(
              profileUser.msg ||
                profileUser.message ||
                profileUser.error ||
                "Unable to save the employee profile.",
            );
          S.user = profileUser;
          localStorage.setItem(SK, JSON.stringify(S));
          if (invite()) {
            const r = await fetch(`${U}/functions/v1/employee-directory-api`, {
              method: "POST",
              headers: h(S.access_token),
              body: JSON.stringify({
                action: "claim_invite",
                token: invite(),
                firstName: v.firstName,
                lastName: v.lastName,
                streetAddress: v.streetAddress,
                phone: v.phone,
              }),
            });
            const d = await r.json().catch(() => ({}));
            if (!r.ok || d.ok === false)
              throw new Error(d.error || "Unable to add your profile to the employee directory.");
            const q = new URLSearchParams(location.search);
            q.delete("invite");
            history.replaceState({}, "", location.pathname + (q.toString() ? `?${q}` : ""));
          }
          await load();
        } catch (e) {
          onboarding(e.message);
        }
      }
      async function ensureDirectoryLink() {
        const r = await fetch(`${U}/functions/v1/employee-directory-api`, {
          method: "POST",
          headers: h(S.access_token),
          body: JSON.stringify({ action: "connect_verified_signup" }),
        });
        const d = await r.json().catch(() => ({}));
        if (!r.ok || d.ok === false)
          throw new Error(
            d.error || "Unable to connect this account to the employee directory.",
          );
        return d.employee;
      }
      async function login() {
        const email = e.value.trim().toLowerCase(),
          password = p.value;
        if (!email || !password) return auth("Enter your email and password.");
        try {
          const r = await fetch(`${U}/auth/v1/token?grant_type=password`, {
            method: "POST",
            headers: h(),
            body: JSON.stringify({ email, password }),
          });
          const d = await r.json().catch(() => ({}));
          if (!r.ok) {
            const detail =
              d.msg ||
              d.message ||
              d.error_description ||
              d.error ||
              `Authentication failed (HTTP ${r.status}).`;
            return auth(`${detail} [${r.status}]`);
          }
          S = d;
          localStorage.setItem(SK, JSON.stringify(d));
          sessionStorage.removeItem(pendingEmailKey);
          load();
        } catch (err) {
          auth(
            `Unable to reach the sign-in service: ${err?.message || "network error"}`,
          );
        }
      }
      async function forgotPassword() {
        const email = document.getElementById("e")?.value.trim().toLowerCase();
        if (!email)
          return auth(
            "Enter the staff email first, then choose Forgot Password.",
          );
        try {
          const redirect = redirectUrl();
          const r = await fetch(
            `${U}/auth/v1/recover?redirect_to=${encodeURIComponent(redirect)}`,
            { method: "POST", headers: h(), body: JSON.stringify({ email }) },
          );
          const d = await r.json().catch(() => ({}));
          if (!r.ok)
            return auth(
              d.msg ||
                d.message ||
                d.error_description ||
                d.error ||
                `Unable to send reset email (${r.status}).`,
            );
          auth(
            "Password reset email requested. Open its link; it will return here so you can choose a new password.",
            email,
          );
        } catch (err) {
          auth(
            `Unable to request password reset: ${err?.message || "network error"}`,
          );
        }
      }
      async function signup() {
        const firstName = document.getElementById("signupFirstName")?.value.trim() || "",
          lastName = document.getElementById("signupLastName")?.value.trim() || "",
          address = document.getElementById("signupAddress")?.value.trim() || "",
          email = document.getElementById("signupEmail")?.value.trim().toLowerCase() || "",
          phone = normalizePhone(document.getElementById("signupPhone")?.value || ""),
          password = document.getElementById("signupPassword")?.value || "";
        if (!firstName) return alert("Enter your first name.");
        if (!lastName) return alert("Enter your last name.");
        if (!address) return alert("Enter your street address.");
        if (!email) return alert("Enter your email address.");
        if (!/^\S+@\S+\.\S+$/.test(email)) return alert("Enter a valid email address.");
        if (!phone) return alert("Enter a valid cellphone number, including area code.");
        if (password.length < 8)
          return alert("Use a password with at least 8 characters.");
        const r = await fetch(
            `${U}/auth/v1/signup?redirect_to=${encodeURIComponent(redirectUrl())}`,
            {
            method: "POST",
            headers: h(),
            body: JSON.stringify({
              email,
              password,
              data: {
                first_name: firstName,
                last_name: lastName,
                full_name: `${firstName} ${lastName}`,
                street_address: address,
                phone,
                cellphone: phone,
              },
            }),
            },
          ),
          d = await r.json().catch(() => ({}));
        if (!r.ok)
          return auth(
            d.msg ||
              d.message ||
              d.error_description ||
              d.error ||
              `Account creation failed (${r.status}).`,
          );
        if (d.access_token) {
          S = d;
          localStorage.setItem(SK, JSON.stringify(d));
          sessionStorage.removeItem(pendingEmailKey);
          load();
        } else if (
          Array.isArray(d.user?.identities) &&
          d.user.identities.length === 0
        ) {
          auth(
            "No new account was created because this email may already be registered. Use Sign In with the existing password, or choose Forgot Password. An already-confirmed account will not receive another signup confirmation email.",
            email,
          );
        } else {
          sessionStorage.setItem(pendingEmailKey, email);
          auth(
            "Account created. Check this email for the confirmation link, including Spam or Promotions. The link will return you directly to the Employee Portal.",
            email,
          );
        }
      }
      async function resendConfirmation() {
        const email = document.getElementById("e")?.value.trim().toLowerCase();
        if (!email)
          return auth(
            "Enter the staff email first, then choose Resend Confirmation.",
          );
        try {
          const r = await fetch(
              `${U}/auth/v1/resend?redirect_to=${encodeURIComponent(redirectUrl())}`,
              {
                method: "POST",
                headers: h(),
                body: JSON.stringify({ type: "signup", email }),
              },
            ),
            d = await r.json().catch(() => ({}));
          if (!r.ok)
            return auth(
              d.msg ||
                d.message ||
                d.error_description ||
                d.error ||
                `Unable to resend confirmation (${r.status}).`,
              email,
            );
          sessionStorage.setItem(pendingEmailKey, email);
          auth(
            "If this is a new unconfirmed account, another confirmation email has been requested. Check Spam or Promotions too. If the account was already confirmed, use Sign In or Forgot Password instead.",
            email,
          );
        } catch (err) {
          auth(
            `Unable to resend confirmation: ${err?.message || "network error"}`,
            email,
          );
        }
      }
      async function consumeAuthRedirect() {
        const hash = new URLSearchParams(location.hash.replace(/^#/, ""));
        const query = new URLSearchParams(location.search);
        const accessToken = hash.get("access_token");
        const error =
          hash.get("error_description") || query.get("error_description");
        if (error) {
          history.replaceState({}, "", location.pathname);
          auth(`Email link could not be completed: ${error}`);
          return false;
        }
        if (!accessToken) return false;
        authRedirectType = hash.get("type") || "";
        S = {
          access_token: accessToken,
          refresh_token: hash.get("refresh_token") || "",
          expires_in: Number(hash.get("expires_in") || 0),
          token_type: hash.get("token_type") || "bearer",
        };
        try {
          const r = await fetch(`${U}/auth/v1/user`, { headers: h(accessToken) });
          if (r.ok) S.user = await r.json();
        } catch (_) {}
        localStorage.setItem(SK, JSON.stringify(S));
        sessionStorage.removeItem(pendingEmailKey);
        history.replaceState({}, "", location.pathname + location.search);
        return true;
      }
      function passwordResetForm() {
        app.innerHTML = `<div class="card"><h2>Choose a New Staff Password</h2><p class="muted">Use at least 8 characters.</p><label>New Password</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password"><label>Confirm New Password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password"><button onclick="completePasswordReset()">Save New Password</button></div>`;
      }
      async function completePasswordReset() {
        const password = document.getElementById("newPassword")?.value || "";
        const confirm = document.getElementById("confirmPassword")?.value || "";
        if (password.length < 8)
          return alert("Use a password with at least 8 characters.");
        if (password !== confirm) return alert("The passwords do not match.");
        try {
          const r = await fetch(`${U}/auth/v1/user`, {
              method: "PUT",
              headers: h(S?.access_token),
              body: JSON.stringify({ password }),
            }),
            d = await r.json().catch(() => ({}));
          if (!r.ok)
            throw new Error(
              d.msg || d.message || d.error || "Unable to update password.",
            );
          authRedirectType = "";
          alert("Password updated. The Employee Portal will open now.");
          load();
        } catch (err) {
          alert(err.message);
        }
      }
      async function refreshSession() {
        if (!S?.refresh_token) return false;
        try {
          const r = await fetch(`${U}/auth/v1/token?grant_type=refresh_token`, {
              method: "POST",
              headers: h(),
              body: JSON.stringify({ refresh_token: S.refresh_token }),
            }),
            d = await r.json().catch(() => ({}));
          if (!r.ok || !d.access_token) return false;
          S = d;
          localStorage.setItem(SK, JSON.stringify(S));
          return true;
        } catch (_) {
          return false;
        }
      }
      async function api(opts = {}, retry = true) {
        const r = await fetch(`${U}/functions/v1/staff-event-api`, {
            ...opts,
            headers: { ...h(S?.access_token), ...(opts.headers || {}) },
          });
        if (r.status === 401 && retry && (await refreshSession()))
          return api(opts, false);
        const d = await r.json();
        if (!r.ok || d.ok === false)
          throw new Error(d.error || "Request failed");
        return d;
      }
      async function load() {
        try {
          if (
            location.hash.includes("access_token=") ||
            location.hash.includes("error_description=") ||
            new URLSearchParams(location.search).has("error_description")
          )
            await consumeAuthRedirect();
          if (!S) S = JSON.parse(localStorage.getItem(SK) || "null");
          if (!S?.access_token) return auth();
          if (authRedirectType === "recovery") return passwordResetForm();
          await refreshCurrentUser();
          if (!profileComplete() || invite()) return onboarding();
          await ensureDirectoryLink();
          const d = await api();
          E = d.events || [];
          render();
        } catch (err) {
          localStorage.removeItem(SK);
          S = null;
          auth(err.message);
        }
      }
      function inviteCard() {
        if (!invite()) return "";
        return `<div class="card"><h3>Complete Employee / Staff Profile</h3><p>This information will automatically be added to the organizer's reusable employee/staff list for future events.</p><label>Full Name</label><input id="inviteFullName" autocomplete="name"><label>Login Email</label><input value="${esc(S?.user?.email || "")}" readonly><label>Phone</label><input id="invitePhone" type="tel" autocomplete="tel"><button onclick="claimInvite()">Complete Employee Profile</button></div>`;
      }
      async function claimInvite() {
        try {
          const fullName = document
              .getElementById("inviteFullName")
              .value.trim(),
            phone = document.getElementById("invitePhone").value.trim();
          if (!fullName) return alert("Enter your full name.");
          const r = await fetch(`${U}/functions/v1/employee-directory-api`, {
              method: "POST",
              headers: h(S.access_token),
              body: JSON.stringify({
                action: "claim_invite",
                token: invite(),
                fullName,
                phone,
              }),
            }),
            d = await r.json();
          if (!r.ok || d.ok === false)
            throw new Error(d.error || "Unable to complete employee profile.");
          alert(
            "Employee profile connected. You are now in the company employee/staff directory.",
          );
          const q = new URLSearchParams(location.search);
          q.delete("invite");
          history.replaceState(
            {},
            "",
            location.pathname + (q.toString() ? `?${q}` : ""),
          );
          load();
        } catch (e) {
          alert(e.message);
        }
      }
      function render() {
        const q = new URLSearchParams(location.search);
        const msg =
          q.get("payment") === "success"
            ? '<div class="card ok">Payment completed. Refreshing event totals.</div>'
            : q.get("payment") === "cancelled"
              ? '<div class="card">Payment was cancelled. No sale was recorded.</div>'
              : "";
        app.innerHTML =
          msg +
          inviteCard() +
          `<div class="card"><div class="grid"><div><h2 style="margin:0 0 5px">Employee Event Workspace</h2><p class="muted" style="margin:0">Signed in as ${esc(S?.user?.email || "staff")}. Only assigned event duties and approved customer tools appear here.</p></div><div class="toolbar" style="justify-content:flex-end"><button class="secondary" onclick="load()">Refresh</button><button class="danger-btn" onclick="logout()">Sign Out</button></div></div></div>${E.length ? E.map(card).join("") : `<div class="card empty"><h3>No Event Assignments Yet</h3><p>Your verified account is connected to the organizer's employee directory, but no active event has been assigned to you yet.</p><div class="toolbar" style="justify-content:center"><button class="secondary" onclick="load()">Refresh Assignments</button><button class="danger-btn" onclick="logout()">Return to Sign In</button></div></div>`}`;
      }
      function saleItem(item, kind = "ticket") {
        const group = Math.max(1, Number(item.groupSize || 1));
        const regular = Number(item.regularValue || 0);
        return `<div class="sale-item"><span class="badge">${kind === "ticket" ? "Admission" : "Featured Beverage"}</span>${group > 1 ? `<span class="badge">Serves ${group}</span>` : ""}<strong>${esc(item.name || "Item")}</strong><span class="price">${money(item.price)}</span>${regular > Number(item.price || 0) ? `<div class="ok">Save ${money(regular - Number(item.price || 0))}</div>` : ""}${item.description ? `<p class="muted">${esc(item.description)}</p>` : ""}</div>`;
      }
      function permissionBadges(p) {
        return [
          [p.can_accept_payments, "Ticket/package sales"],
          [p.can_check_in && p.can_scan_qr, "Admission check-in"],
          [p.can_redeem_items && p.can_scan_qr, "Item redemption"],
          [p.can_view_guest_list, "Guest list"],
        ].filter((x) => x[0]).map((x) => `<span class="badge ok">${x[1]}</span>`).join("") || '<span class="badge">No operational permissions</span>';
      }
      function card(x) {
        x = { ...x, time: SNPTime.formatTime(x.time) };
        const p = x.permissions || {},
          sh = x.shift || {},
          sales = x.staffSales || {};
        const checkoutEnabled = p.can_accept_payments && x.salesChannels?.eventbrite && x.eventbriteCheckoutUrl;
        const ticketItems = (x.ticketTypes || []).map((t) => saleItem(t, "ticket")).join("");
        const menuItems = p.can_event_sales ? (x.menuItems || []).map((i) => saleItem(i, "menu")).join("") : "";
        const guestRows = (x.guestList || []).map((g) => `<div class="guest-row"><div><strong>${esc(g.name || g.email || g.status || "Guest")}</strong>${g.email ? `<br><span class="muted">${esc(g.email)}</span>` : ""}</div><div>${g.checkedIn ? '<span class="badge ok">Checked in</span>' : `<span class="badge">${esc(g.status || "Expected")}</span>`}</div></div>`).join("");
        return `<article class="card event-card"><div class="event-head"><span class="badge ok">${esc(x.status || "Assigned")}</span><h2>${esc(x.name)}</h2><div>${esc(x.date)} at ${esc(x.time)}${x.venueName ? " • " + esc(x.venueName) : ""}</div></div><div class="event-body">
          <div class="grid"><div class="stat"><strong>Shift Status</strong><div class="value">${sh.active ? "Clocked In" : "Clocked Out"}</div><p class="muted">${sh.active ? `Since ${new Date(sh.clockIn).toLocaleTimeString()}` : sh.clockOut ? `Last out ${new Date(sh.clockOut).toLocaleTimeString()}` : "No shift started"}</p><button class="${sh.active ? "danger-btn" : "success"}" onclick="clock('${x.id}','${sh.active ? "clock_out" : "clock_in"}')">${sh.active ? "Clock Out" : "Clock In"}</button></div><div class="stat"><strong>Paint Admissions</strong><div class="value">${Number(x.paintTicketsSold || 0)} / ${Number(x.paintCapacity || 0)}</div><p class="muted">Shared paint capacity</p></div><div class="stat"><strong>Exhibit Admissions</strong><div class="value">${Number(x.exhibitTicketsSold || 0)} / ${Number(x.exhibitCapacity || 0)}</div><p class="muted">Art exhibit capacity</p></div><div class="stat"><strong>Portal Sales History</strong><div class="value">${money(sales.total || 0)}</div><p class="muted">${sales.count || 0} previously attributed transaction${Number(sales.count || 0) === 1 ? "" : "s"}</p></div></div>
          <div class="section"><h3>Your Assigned Tools</h3><div>${permissionBadges(p)}</div></div>
          ${p.can_accept_payments ? `<div class="section"><h3>Sell Tickets & Packages</h3><p class="section-note">Help the customer choose below, then open the secure Eventbrite checkout. Eventbrite collects payment and sends the customer’s tickets.</p><h4>Admission options</h4><div class="item-grid">${ticketItems || '<div class="empty">No admission tickets are active.</div>'}</div>${p.can_event_sales ? `<h4>Featured beverage options</h4><div class="item-grid">${menuItems || '<div class="empty">No beverage packages are active.</div>'}</div>` : ""}${checkoutEnabled ? `<div class="toolbar"><button class="primary" onclick="openEventbriteCheckout('${esc(x.eventbriteCheckoutUrl)}')">Open Eventbrite Checkout</button><button class="secondary" onclick="copyEventbriteCheckout('${esc(x.eventbriteCheckoutUrl)}')">Copy Checkout Link</button></div>` : '<div class="empty">Eventbrite checkout is not available for this event. Contact the event organizer.</div>'}</div>` : ""}
          ${p.can_check_in && p.can_scan_qr ? `<div class="section"><h3>Admission Check-In</h3><p class="section-note">Scan the guest’s ticket, then select the matching check-in button.</p><div class="row"><input id="qr-${x.id}" placeholder="Scan or enter ticket barcode"><button class="secondary" onclick="camera('${x.id}','qr')">Use Camera</button></div><video id="video-${x.id}" playsinline muted></video><div class="toolbar"><button onclick="checkin('${x.id}','checkin_eventbrite')">Check In Eventbrite Ticket</button><button class="secondary" onclick="checkin('${x.id}','checkin_snp_ticket')">Check In SNP Ticket</button></div></div>` : ""}
          ${p.can_redeem_items && p.can_scan_qr ? `<div class="section"><h3>Redeem Included & Prepaid Items</h3><p class="section-note">Use the Eventbrite ticket barcode for included package benefits. Use an SNP prepaid QR for older prepaid orders.</p><div class="nested"><strong>Eventbrite ticket or package benefit</strong><div class="row" style="margin-top:8px"><input id="ebbenefit-${x.id}" placeholder="Scan Eventbrite ticket barcode"><button class="secondary" onclick="camera('${x.id}','ebbenefit')">Use Camera</button><button onclick="inspectEventbriteBenefit('${x.id}')">Find Included Items</button></div><div id="ebbenefitout-${x.id}"></div></div><div class="nested"><strong>SNP prepaid order</strong><div class="row" style="margin-top:8px"><input id="pre-${x.id}" placeholder="Scan SNP-PREPAID QR"><button class="secondary" onclick="camera('${x.id}','pre')">Use Camera</button><button onclick="inspectPrepaid('${x.id}')">Find Prepaid Items</button></div><div id="preout-${x.id}"></div></div></div>` : ""}
          ${p.can_view_guest_list ? `<div class="section"><details><summary>Guest List (${(x.guestList || []).length})</summary><div style="margin-top:10px">${guestRows || '<div class="empty">No guests are listed yet.</div>'}</div></details></div>` : ""}
        </div></article>`;
      }
      async function clock(id, action) {
        try {
          const d = await api({
            method: "POST",
            body: JSON.stringify({ action, eventId: id }),
          });
          alert(d.message);
          load();
        } catch (e) {
          alert(e.message);
        }
      }
      async function checkin(id, action) {
        try {
          stopCamera();
          const v = document.getElementById(`qr-${id}`).value.trim();
          const d = await api({
            method: "POST",
            body: JSON.stringify({ action, eventId: id, qr: v }),
          });
          alert(d.message + (d.warning ? `\n${d.warning}` : ""));
          load();
        } catch (e) {
          alert(e.message);
        }
      }
      function safeEventbriteUrl(value) {
        try {
          const u = new URL(String(value || ""));
          if (u.protocol !== "https:" || !(u.hostname === "eventbrite.com" || u.hostname.endsWith(".eventbrite.com"))) throw new Error();
          return u.href;
        } catch (_) {
          return "";
        }
      }
      function openEventbriteCheckout(value) {
        const url = safeEventbriteUrl(value);
        if (!url) return alert("The Eventbrite checkout address is unavailable.");
        window.open(url, "_blank", "noopener,noreferrer");
      }
      async function copyEventbriteCheckout(value) {
        const url = safeEventbriteUrl(value);
        if (!url) return alert("The Eventbrite checkout address is unavailable.");
        try {
          await navigator.clipboard.writeText(url);
          alert("Eventbrite checkout link copied.");
        } catch (_) {
          prompt("Copy this Eventbrite checkout link:", url);
        }
      }
      async function inspectPrepaid(id) {
        try {
          stopCamera();
          const qr = document.getElementById(`pre-${id}`).value.trim(),
            d = await api({
              method: "POST",
              body: JSON.stringify({
                action: "inspect_prepaid",
                eventId: id,
                qr,
              }),
            }),
            p = d.pass;
          document.getElementById(`preout-${id}`).innerHTML =
            `<div class="card"><strong>Prepaid order</strong>${p.items.map((i) => `<p>${esc(i.label)} — ${i.remaining} remaining <button ${i.remaining <= 0 ? "disabled" : ""} onclick="redeem('${id}','${p.id}','${i.id}')">Redeem 1</button></p>`).join("")}</div>`;
        } catch (e) {
          alert(e.message);
        }
      }
      async function inspectEventbriteBenefit(id) {
        try {
          stopCamera();
          const barcode = document.getElementById(`ebbenefit-${id}`).value.trim();
          if (!barcode) return alert("Scan or enter the Eventbrite ticket barcode.");
          const d = await api({
            method: "POST",
            body: JSON.stringify({ action: "inspect_eventbrite_entitlements", eventId: id, barcode }),
          });
          const p = d.pass;
          document.getElementById(`ebbenefitout-${id}`).innerHTML =
            `<div class="nested"><strong>${esc(p.ticketClassName || "Eventbrite purchase")}</strong>${p.customerName ? `<p class="muted">Customer: ${esc(p.customerName)}</p>` : ""}${p.items.length ? p.items.map((i) => `<div class="guest-row"><div><strong>${esc(i.label)}</strong><br><span class="muted">${i.remaining} of ${i.quantity} remaining</span></div><button ${i.remaining <= 0 ? "disabled" : ""} onclick="redeemEventbriteBenefit('${id}','${p.attendeeId}','${i.id}')">${i.remaining <= 0 ? "Redeemed" : "Redeem 1"}</button></div>`).join("") : '<div class="empty">This Eventbrite ticket has no included or prepaid items to redeem.</div>'}</div>`;
        } catch (e) {
          alert(e.message);
        }
      }
      async function redeemEventbriteBenefit(eventId, attendeeId, entitlementId) {
        try {
          const d = await api({
            method: "POST",
            body: JSON.stringify({ action: "redeem_eventbrite_entitlement", eventId, attendeeId, entitlementId }),
          });
          alert(d.message);
          inspectEventbriteBenefit(eventId);
        } catch (e) {
          alert(e.message);
        }
      }
      async function redeem(eventId, passId, entitlementId) {
        try {
          const d = await api({
            method: "POST",
            body: JSON.stringify({
              action: "redeem_prepaid",
              eventId,
              passId,
              entitlementId,
            }),
          });
          alert(d.message);
          inspectPrepaid(eventId);
        } catch (e) {
          alert(e.message);
        }
      }
      async function camera(id, target = "qr") {
        stopCamera();
        if (!navigator.mediaDevices?.getUserMedia)
          return alert("Camera access is not available.");
        try {
          const v = document.getElementById(`video-${id}`);
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false,
          });
          v.srcObject = stream;
          v.style.display = "block";
          await v.play();
          if ("BarcodeDetector" in window) {
            const d = new BarcodeDetector({
              formats: ["qr_code", "code_128", "code_39", "ean_13", "upc_a"],
            });
            const tick = async () => {
              if (!stream) return;
              try {
                const codes = await d.detect(v);
                if (codes?.length) {
                  document.getElementById(
                    target === "pre" ? `pre-${id}` : target === "ebbenefit" ? `ebbenefit-${id}` : `qr-${id}`,
                  ).value = codes[0].rawValue;
                  stopCamera();
                  return;
                }
              } catch (_) {}
              scanTimer = setTimeout(tick, 250);
            };
            tick();
          } else
            alert(
              "Camera opened, but this browser does not support automatic barcode detection. Enter the code manually.",
            );
        } catch (e) {
          stopCamera();
          alert("Unable to open camera. Check camera permission.");
        }
      }
      function stopCamera() {
        if (scanTimer) clearTimeout(scanTimer);
        scanTimer = null;
        if (stream) stream.getTracks().forEach((t) => t.stop());
        stream = null;
        document.querySelectorAll("video").forEach((v) => {
          v.pause?.();
          v.srcObject = null;
          v.style.display = "none";
        });
      }
      function logout() {
        stopCamera();
        localStorage.removeItem(SK);
        S = null;
        auth("Signed out.");
      }
      load();
    </script>
  </body>
</html>
